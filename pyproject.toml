[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-control"
version = "0.1.0"
description = "Unified Python and CLI control for Piper real and MuJoCo backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "typer>=0.9"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
real = ["python-can>=3.3.4"]
camera = ["pyrealsense2>=2.50"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
piper = "piper_control.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
