[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-control"
version = "0.1.0"
description = "Unified Piper and FR3 MuJoCo and real-robot control with D435i RGB-D"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "typer>=0.20,<1"]

[project.optional-dependencies]
# Pinocchio 3.8–3.9 wheels use urdfdom 4 and TinyXML2 10.
mujoco = ["mujoco>=3.2.7,<4", "pin>=3.8,<3.10", "cmeel-urdfdom>=4,<5", "cmeel-tinyxml2>=10,<11", "Pillow>=10.4,<13"]
real = ["python-can>=4,<5", "pin>=3.8,<3.10", "cmeel-urdfdom>=4,<5", "cmeel-tinyxml2>=10,<11"]
camera = ["pyrealsense2>=2.56,<3", "Pillow>=10.4,<13"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
robot_control = "robot_control.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_control = ["assets/scenes/*.xml"]
"robot_control.fr3" = ["assets/scenes/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
